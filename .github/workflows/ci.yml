name: Validate CODE:FIT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_tests:
        description: Run the full Chromium, Firefox and WebKit suite
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codefit
          POSTGRES_PASSWORD: codefit_test
          POSTGRES_DB: codefit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://codefit:codefit_test@localhost:5432/codefit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:unused
      - run: npm test
      - if: ${{ inputs.full_browser_tests == true }}
        run: npm run build
      - if: ${{ inputs.full_browser_tests == true }}
        run: npx playwright install --with-deps chromium firefox webkit
      - if: ${{ inputs.full_browser_tests == true }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.full_browser_tests == true }}
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
